<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preusmjeravanje... | Kezić Vizuali</title>
<meta name="robots" content="noindex">
<script>
  // Ova stranica je zamijenjena s knjiga.html (svi tekstovi se sad
  // otvaraju u "knjiga" prikazu radi ugodnijeg čitanja). Ostavljena je
  // ovdje samo da preusmjeri stare/spremljene linkove.
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  window.location.replace('knjiga.html' + (slug ? '?slug=' + encodeURIComponent(slug) : ''));
</script>
</head>
<body style="background:#080807;color:#8a8070;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
  Preusmjeravanje na <a href="tekstovi.html" style="color:#c9a84c;margin-left:6px;">tekstovi</a>...
</body>
</html>
