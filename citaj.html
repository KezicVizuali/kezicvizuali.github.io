<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Tekst | Kezić Vizuali</title>
<meta name="description" id="page-description" content="Tekstovi Krunoslava Kezića.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #c9a84c; --gold-light: #e8c96a;
  --bg: #080807; --bg2: #0f0f0d; --bg3: #161614;
  --text: #f0ead8; --text-muted: #8a8070; --text-faint: #5a5448;
  --border: rgba(201,168,76,0.14); --border-hover: rgba(201,168,76,0.3);
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
}
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.7; font-weight: 300; }

*, *::before, *::after { cursor: none !important; }
#cursor { position: fixed; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: transform 0.1s, width 0.25s, height 0.25s; }
#cursor-ring { position: fixed; width: 32px; height: 32px; border: 1px solid rgba(201,168,76,0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); transition: transform 0.18s ease, width 0.25s, height 0.25s, border-color 0.25s; }
body:has(a:hover) #cursor, body:has(button:hover) #cursor { width: 14px; height: 14px; }
body:has(a:hover) #cursor-ring, body:has(button:hover) #cursor-ring { width: 44px; height: 44px; border-color: rgba(201,168,76,0.9); }
@media (pointer: coarse) { #cursor, #cursor-ring { display:none !important; } *, *::before, *::after { cursor: auto !important; } }

nav { position: fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 5%; height:72px; background:rgba(8,8,7,0.88); backdrop-filter: blur(24px) saturate(180%); border-bottom:1px solid var(--border); transition: background 0.3s, border-color 0.3s; }
nav.scrolled { background: rgba(8,8,7,0.97); border-color: rgba(201,168,76,0.22); }
.nav-logo { font-family: var(--serif); font-size:1.35rem; font-weight:600; color: var(--gold); text-decoration:none; }
.nav-links { display:flex; gap:2.5rem; list-style:none; }
.nav-links a { color: var(--text-muted); text-decoration:none; font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase; transition: color 0.2s; }
.nav-links a:hover, .nav-links a.active { color: var(--gold); }
.hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer !important; background:none; border:none; padding:4px; }
.hamburger span { display:block; width:24px; height:1px; background: var(--text); transition:0.3s; }

.article-header { padding: 190px 5% 3rem; text-align:center; }
.article-tag { display:inline-block; font-size:0.68rem; letter-spacing:0.16em; text-transform:uppercase; color: var(--gold); border:1px solid var(--border); padding:0.4rem 1.1rem; border-radius:50px; margin-bottom:1.6rem; }
.article-title { font-family: var(--serif); font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight:300; line-height:1.15; max-width: 820px; margin: 0 auto 1.2rem; }
.article-meta { color: var(--text-faint); font-size:0.75rem; letter-spacing:0.12em; text-transform:uppercase; }

.article-body { padding: 2rem 5% 7rem; }
.article-content { max-width: 700px; margin: 0 auto; font-family: var(--serif); }
.article-content p { font-size: 1.28rem; line-height: 1.95; color: var(--text); font-weight:300; margin-bottom: 1.8rem; }
.article-content p::first-letter { font-size: 2.4em; float:left; line-height:0.85; padding-right:0.1em; padding-top:0.08em; color: var(--gold); font-weight:600; }
.article-content p:not(:first-of-type)::first-letter { font-size: inherit; float:none; padding:0; color:inherit; font-weight:inherit; }
.article-divider { width:50px; height:1px; background: linear-gradient(to right, var(--gold), transparent); margin: 3rem auto; }
.article-signature { text-align:center; font-family: var(--serif); font-style:italic; color: var(--text-muted); margin-top: 2.5rem; }

.article-nav { max-width:700px; margin: 4rem auto 0; display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top: 2rem; }
.back-link { color: var(--text-muted); text-decoration:none; font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase; transition: color 0.2s; }
.back-link:hover { color: var(--gold); }

.not-found { text-align:center; padding: 8rem 5%; }
.not-found h1 { font-family: var(--serif); font-size:2.4rem; margin-bottom:1rem; }
.not-found p { color: var(--text-muted); }
.not-found a { color: var(--gold); }

@media (max-width:900px) {
  .nav-links { display:none; }
  .hamburger { display:flex; }
  .nav-links {
    position: fixed; top:72px; left:0; right:0;
    background: rgba(8,8,7,0.98);
    flex-direction: column; gap:0; padding:0;
    border-bottom: 1px solid var(--border);
  }
  .nav-links.open { display:flex; }
  .nav-links li { border-bottom: 1px solid rgba(201,168,76,0.06); }
  .nav-links a { display:block; padding:1.5rem 5%; }
}
</style>
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>

  <nav id="navbar">
    <a href="index.html" class="nav-logo">Kezić Vizuali</a>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html#o-meni">O nama</a></li>
      <li><a href="portfolio.html">Web Portfolio</a></li>
      <li><a href="galerija.html">Foto Galerija</a></li>
      <li><a href="tekstovi.html" class="active">Tekstovi</a></li>
      <li><a href="index.html#kontakt">Kontakt</a></li>
    </ul>
  </nav>

  <div id="app"></div>

  <script src="tekstovi-data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const tekst = TEKSTOVI.find(t => t.slug === slug);
    const app = document.getElementById('app');

    if (tekst && tekst.tip !== 'roman') {
      document.title = tekst.naslov + ' | Kezić Vizuali';
      document.getElementById('page-description').setAttribute('content', tekst.excerpt);

      const paragraphsHtml = tekst.sadrzaj.map(p => `<p>${p}</p>`).join('');

      app.innerHTML = `
        <header class="article-header">
          <span class="article-tag">${tekst.tipLabel}</span>
          <h1 class="article-title">${tekst.naslov}</h1>
          ${tekst.podnaslov ? `<p style="color:var(--text-muted);margin-top:0.8rem;">${tekst.podnaslov}</p>` : ''}
          <div class="article-meta" style="margin-top:1rem;">${tekst.datum}</div>
        </header>
        <section class="article-body">
          <div class="article-content">
            ${paragraphsHtml}
            <div class="article-divider"></div>
            <p class="article-signature">— ${tekst.autor}</p>
          </div>
          <div class="article-nav">
            <a href="tekstovi.html" class="back-link">&larr; Svi tekstovi</a>
          </div>
        </section>
      `;
    } else if (tekst && tekst.tip === 'roman') {
      // Ulomci romana imaju svoj poseban "knjiga" prikaz
      window.location.replace('knjiga.html?slug=' + encodeURIComponent(slug));
    } else {
      app.innerHTML = `
        <div class="not-found">
          <h1>Tekst nije pronađen</h1>
          <p>Traženi tekst ne postoji ili je uklonjen. <a href="tekstovi.html">Vratite se na sve tekstove.</a></p>
        </div>
      `;
    }

    // Cursor
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
    function animateCursor(){ if(cursor&&ring){ cursor.style.left=mx+'px'; cursor.style.top=my+'px'; rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; } requestAnimationFrame(animateCursor); }
    animateCursor();

    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', window.scrollY>50));
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('nav-links');
    hamburger.addEventListener('click', () => navLinks.classList.toggle('open'));
    navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));
  </script>
</body>
</html>
