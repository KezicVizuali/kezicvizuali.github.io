<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Knjiga | Kezić Vizuali</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #c9a84c; --gold-light: #e8c96a;
  --bg: #080807; --bg2: #0f0f0d;
  --text: #f0ead8; --text-muted: #8a8070; --text-faint: #5a5448;
  --border: rgba(201,168,76,0.14); --border-hover: rgba(201,168,76,0.3);
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
  --paper: #f4ecd8;
  --paper-text: #2b2418;
}
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight:300; min-height:100vh; }

nav { position: fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 5%; height:64px; background:rgba(8,8,7,0.92); backdrop-filter: blur(20px); border-bottom:1px solid var(--border); }
.nav-logo { font-family: var(--serif); font-size:1.2rem; font-weight:600; color: var(--gold); text-decoration:none; }
.back-link { color: var(--text-muted); text-decoration:none; font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; transition: color 0.2s; }
.back-link:hover { color: var(--gold); }

/* ── 18+ GATE ── */
#gate { position: fixed; inset:0; z-index: 500; background: rgba(4,4,3,0.97); display:flex; align-items:center; justify-content:center; padding: 2rem; }
.gate-box { max-width: 460px; text-align:center; border: 1px solid var(--border); padding: 3rem 2.5rem; background: var(--bg2); }
.gate-badge { display:inline-block; font-size:0.7rem; letter-spacing:0.2em; color:#e07a5f; border:1px solid rgba(224,122,95,0.35); padding:0.4rem 1rem; border-radius:50px; margin-bottom:1.5rem; }
.gate-box h2 { font-family: var(--serif); font-size:1.9rem; font-weight:400; margin-bottom:1.2rem; }
.gate-box p { color: var(--text-muted); font-size:0.92rem; line-height:1.8; margin-bottom:2rem; }
.gate-btns { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
.gate-btn { padding:0.8rem 1.8rem; font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase; text-decoration:none; border:1px solid var(--border); color: var(--text-muted); background:transparent; cursor:pointer; transition: all 0.2s; font-family: var(--sans); }
.gate-btn.confirm { background: var(--gold); border-color: var(--gold); color:#080807; }
.gate-btn.confirm:hover { background: var(--gold-light); }
.gate-btn.decline:hover { color: var(--text); border-color: var(--border-hover); }

/* ── KNJIGA ── */
.book-wrap { padding: 100px 5% 3rem; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
.book-meta { text-align:center; margin-bottom:2rem; }
.book-meta .tag { font-size:0.65rem; letter-spacing:0.18em; text-transform:uppercase; color: var(--gold); }
.book-meta h1 { font-family: var(--serif); font-size: clamp(1.6rem,3.5vw,2.4rem); font-weight:300; margin-top:0.6rem; }

#book-container { width: 100%; max-width: 900px; display:flex; justify-content:center; }
#book { }
.my-page { background: var(--paper); color: var(--paper-text); box-shadow: inset 0 0 40px rgba(0,0,0,0.06); }
.page-content { height:100%; padding: 2.2rem 2rem; display:flex; flex-direction:column; overflow-y:auto; scrollbar-width: thin; scrollbar-color: rgba(43,36,24,0.35) transparent; }
.page-content::-webkit-scrollbar { width: 5px; }
.page-content::-webkit-scrollbar-thumb { background: rgba(43,36,24,0.3); border-radius: 3px; }
.page-content p { font-family: var(--serif); font-size: 1.08rem; line-height:1.75; margin-bottom: 0.9rem; }
.page-num { margin-top:auto; text-align:center; font-size:0.65rem; letter-spacing:0.1em; color: rgba(43,36,24,0.4); padding-top:0.5rem; }

.cover-page, .end-page { background: linear-gradient(160deg, #16130c 0%, #0c0a06 100%); color: var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 2.5rem; border: 1px solid rgba(201,168,76,0.25); }
.cover-page .eyebrow, .end-page .eyebrow { font-size:0.62rem; letter-spacing:0.22em; text-transform:uppercase; color: var(--gold); margin-bottom:1.5rem; }
.cover-page h2 { font-family: var(--serif); font-size: 1.9rem; font-weight:400; margin-bottom: 0.8rem; line-height:1.2; }
.cover-page .sub { font-size:0.82rem; color: var(--text-muted); line-height:1.7; margin-bottom:1.5rem; }
.cover-page .autor { font-family: var(--serif); font-style:italic; color: var(--gold-light); font-size:1rem; }
.end-page p { color: var(--text-muted); font-size:0.92rem; line-height:1.8; margin-bottom:1.5rem; }
.end-page a { color: var(--gold); text-decoration:none; font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase; }

.controls { display:flex; align-items:center; gap:1.6rem; margin-top:2rem; }
.ctrl-btn { width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:transparent; color: var(--text); font-size:1.1rem; cursor:pointer; transition: all 0.2s; display:flex; align-items:center; justify-content:center; }
.ctrl-btn:hover { border-color: var(--gold); color: var(--gold); }
.ctrl-btn:disabled { opacity:0.3; cursor:default; }
#page-indicator { font-size:0.75rem; letter-spacing:0.1em; color: var(--text-faint); min-width:70px; text-align:center; }

.hint { margin-top:1.2rem; font-size:0.72rem; color: var(--text-faint); text-align:center; }

#fallback { display:none; max-width:700px; margin: 0 auto; padding: 0 5%; }
#fallback p { font-family: var(--serif); font-size:1.2rem; line-height:1.9; margin-bottom:1.5rem; color: var(--text); }

@media (max-width: 640px) {
  .book-wrap { padding-top: 84px; }
  .page-content { padding: 1.4rem 1.2rem; }
  .page-content p { font-size: 0.95rem; }
}
</style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Kezić Vizuali</a>
    <a href="tekstovi.html" class="back-link">&larr; Svi tekstovi</a>
  </nav>

  <div id="gate" style="display:none;">
    <div class="gate-box">
      <span class="gate-badge">Sadržaj 18+</span>
      <h2>Prije nego nastaviš</h2>
      <p>Ovaj ulomak sadrži eksplicitne scene namijenjene isključivo odrasloj publici. Klikom na "Nastavi" potvrđuješ da imaš navršenih 18 godina.</p>
      <div class="gate-btns">
        <button class="gate-btn decline" id="gate-decline">Vrati me natrag</button>
        <button class="gate-btn confirm" id="gate-confirm">Imam 18+ godina, nastavi</button>
      </div>
    </div>
  </div>

  <div class="book-wrap" id="book-wrap" style="display:none;">
    <div class="book-meta">
      <div class="tag" id="meta-tag"></div>
      <h1 id="meta-naslov"></h1>
    </div>

    <div id="book-container">
      <div id="book"></div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-prev" aria-label="Prethodna stranica">&#8592;</button>
      <span id="page-indicator">1 / 1</span>
      <button class="ctrl-btn" id="btn-next" aria-label="Sljedeća stranica">&#8594;</button>
    </div>
    <p class="hint">Listaj klikom na rubove stranice, strelicama na tipkovnici, ili prstom na dodirnom ekranu.</p>
  </div>

  <div id="fallback"></div>

  <script src="tekstovi-data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const tekst = TEKSTOVI.find(t => t.slug === slug);
    const gate = document.getElementById('gate');
    const bookWrap = document.getElementById('book-wrap');
    const fallback = document.getElementById('fallback');

    if (!tekst) {
      document.body.innerHTML = `
        <nav><a href="index.html" class="nav-logo">Kezić Vizuali</a><a href="tekstovi.html" class="back-link">&larr; Svi tekstovi</a></nav>
        <div style="padding:180px 5% 5rem; text-align:center;">
          <h1 style="font-family:var(--serif); font-size:2.2rem; margin-bottom:1rem;">Tekst nije pronađen</h1>
          <p style="color:var(--text-muted);">Traženi ulomak ne postoji. <a href="tekstovi.html" style="color:var(--gold);">Vratite se na sve tekstove.</a></p>
        </div>`;
    } else {
      document.title = tekst.naslov + ' | Kezić Vizuali';

      function startReading() {
        gate.style.display = 'none';
        bookWrap.style.display = 'flex';
        buildBook();
      }

      if (tekst.zreliSadrzaj && sessionStorage.getItem('potvrdaDobi18_' + tekst.slug) !== 'da') {
        gate.style.display = 'flex';
        document.getElementById('gate-confirm').addEventListener('click', () => {
          sessionStorage.setItem('potvrdaDobi18_' + tekst.slug, 'da');
          startReading();
        });
        document.getElementById('gate-decline').addEventListener('click', () => {
          window.location.href = 'tekstovi.html';
        });
      } else {
        startReading();
      }

      function paginirajTekst(paragraphs, budzet) {
        // Dijeli isključivo po riječima (nikad po regexu za rečenice),
        // pa je zagarantirano da se nijedan znak teksta nikad ne izgubi
        // niti da jedan odlomak ostane predugačak za jednu stranicu.
        const stranice = [];
        let trenutna = [];
        let duljina = 0;

        function zatvoriStranicu() {
          if (trenutna.length) {
            stranice.push(trenutna);
            trenutna = [];
            duljina = 0;
          }
        }

        paragraphs.forEach(par => {
          if (par.length <= budzet) {
            if (duljina + par.length > budzet) zatvoriStranicu();
            trenutna.push(par);
            duljina += par.length;
            return;
          }
          // Odlomak je dulji od cijelog budžeta stranice — dijeli se po riječima
          const riječi = par.split(/\s+/);
          let dio = '';
          riječi.forEach(rijec => {
            const kandidat = dio ? dio + ' ' + rijec : rijec;
            if (kandidat.length > budzet) {
              if (duljina + dio.length > budzet) zatvoriStranicu();
              trenutna.push(dio);
              duljina += dio.length;
              zatvoriStranicu();
              dio = rijec;
            } else {
              dio = kandidat;
            }
          });
          if (dio) {
            if (duljina + dio.length > budzet) zatvoriStranicu();
            trenutna.push(dio);
            duljina += dio.length;
          }
        });
        zatvoriStranicu();
        return stranice;
      }

      function buildBook() {
        document.getElementById('meta-tag').textContent = tekst.tipLabel;
        document.getElementById('meta-naslov').textContent = tekst.naslov;

        const stranice = paginirajTekst(tekst.sadrzaj, 820);
        const bookEl = document.getElementById('book');
        bookEl.innerHTML = '';

        // Naslovnica
        const cover = document.createElement('div');
        cover.className = 'my-page cover-page';
        cover.setAttribute('data-density', 'hard');
        cover.innerHTML = `
          <div class="eyebrow">${tekst.tipLabel}</div>
          <h2>${tekst.naslov}</h2>
          ${tekst.podnaslov ? `<div class="sub">${tekst.podnaslov}</div>` : ''}
          <div class="autor">${tekst.autor}</div>
        `;
        bookEl.appendChild(cover);

        // Sadržajne stranice
        stranice.forEach((odlomci, i) => {
          const page = document.createElement('div');
          page.className = 'my-page';
          const p = document.createElement('div');
          p.className = 'page-content';
          p.innerHTML = odlomci.map(o => `<p>${o}</p>`).join('') + `<div class="page-num">${i + 1}</div>`;
          page.appendChild(p);
          bookEl.appendChild(page);
        });

        // Zadnja stranica
        const end = document.createElement('div');
        end.className = 'my-page end-page';
        end.setAttribute('data-density', 'hard');
        const endEyebrow = tekst.tip === 'roman' ? 'Kraj ulomka' : 'Kraj';
        const endText = tekst.tip === 'roman'
          ? 'Priča se nastavlja... vrati se uskoro za više.'
          : 'Hvala na čitanju.';
        end.innerHTML = `
          <div class="eyebrow">${endEyebrow}</div>
          <p>${endText}</p>
          <a href="tekstovi.html">&larr; Natrag na sve tekstove</a>
        `;
        bookEl.appendChild(end);

        if (window.St && window.St.PageFlip) {
          try {
            const pageFlip = new St.PageFlip(bookEl, {
              width: 420,
              height: 600,
              size: 'stretch',
              minWidth: 280,
              maxWidth: 550,
              minHeight: 400,
              maxHeight: 780,
              showCover: true,
              maxShadowOpacity: 0.4,
              mobileScrollSupport: false,
              usePortrait: true
            });
            pageFlip.loadFromHTML(bookEl.querySelectorAll('.my-page'));

            const indicator = document.getElementById('page-indicator');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const total = pageFlip.getPageCount();

            function updateIndicator() {
              indicator.textContent = (pageFlip.getCurrentPageIndex() + 1) + ' / ' + total;
            }
            updateIndicator();
            pageFlip.on('flip', updateIndicator);

            btnPrev.addEventListener('click', () => pageFlip.flipPrev());
            btnNext.addEventListener('click', () => pageFlip.flipNext());
            document.addEventListener('keydown', (e) => {
              if (e.key === 'ArrowLeft') pageFlip.flipPrev();
              if (e.key === 'ArrowRight') pageFlip.flipNext();
            });
          } catch (err) {
            console.error('PageFlip greška, prelazim na jednostavan prikaz:', err);
            showFallback(stranice);
          }
        } else {
          showFallback(stranice);
        }
      }

      function showFallback(stranice) {
        bookWrap.style.display = 'none';
        fallback.style.display = 'block';
        fallback.style.paddingTop = '110px';
        fallback.innerHTML = `
          <div style="text-align:center; margin-bottom:2.5rem;">
            <div style="font-size:0.65rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold);">${tekst.tipLabel}</div>
            <h1 style="font-family:var(--serif); font-size:2rem; font-weight:300; margin-top:0.6rem;">${tekst.naslov}</h1>
          </div>
          ${tekst.sadrzaj.map(p => `<p>${p}</p>`).join('')}
          <div style="text-align:center; margin:3rem 0 5rem;">
            <a href="tekstovi.html" style="color:var(--gold); text-decoration:none; font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase;">&larr; Natrag na sve tekstove</a>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
